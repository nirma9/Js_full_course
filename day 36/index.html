<!DOCTYPE html>
<html lang="en">
<head>
               <meta charset="UTF-8">
               <meta name="viewport" content="width=device-width, initial-scale=1.0">
               <title>Document</title>
</head>
<body>
              <h1> POsts manager app</h1>
              <button onclick="loadposts()">LOAD POST</button>
              <button onclick="addpost()">ADD POSTS</button>
              <button onclick="updatepost()">updatepost</button>
              <button onclick="deleteposts()"> delete posts</button>
              
              <button onclick="testerror()"> TEST ERROR</button>

              <pre id = "output"></pre>

              <script>

               // get
               
               function loadposts(){
                              fetch('https://jsonplaceholder.typicode.com/posts')
                              .then(res => res.json())
                              .then(data => {
                                             document.getElementById('output').textContent= JSON.stringify(data.slice(0,5),null,2);
                              })
               }

               function addpost(){
                              fetch('https://jsonplaceholder.typicode.com/posts',{
                                             method: "POST",
                                             headers: {
                                                            'content-type':'applications/json'

                                             },
                                             body:JSON.stringify({
                                                            title:'New POSt',
                                                            body:'Learning API project',
                                                            userid: 1
                                             })
                              })
                              .then(res => res.json())
                              .then(data => {
                                             document.getElementById('output').textContent = JSON.stringify(data,null,2);
                              });
               }



               function updatepost(){
                              fetch('https://jsonplaceholder.typicode.com/posts/1',{
                                             method:'PUT',
                                             headers: {
                                                            'content-type':'application/json'
                                             },
                                             body:JSON.stringify({
                                                            title: 'updated title',
                                                            body:'POSt updated succesfuuly',
                                                            userid:1
                                             })
                              })
                              .then(res => res.json())
                              .then(data => {
                                             document.getElementById('output').textContent = JSON.stringify(data,null,2);
                              });
               }




               //delete

               function deleteposts(){
                              fetch('https://jsonplaceholder.typicode.com/posts/1',{
                                             method:'DELETE'
                              })
                              .then(() => {
                                             document.getElementById('output').textContent = 'posts deleted successfully..';
                              });
               }



               function testerror(){
                              fetch('https://jsonplaceholder.typicode.com/posts/999')
                              .then(res => {
                                             if(!res.ok){
                                                            throw new Error('something went wrong..');
                                             }return res.json();
                              })
                              .then(data => console.log(data))
                              .catch(err => {
                                             document.getElementById('output').textContent = err.message;
                              });
               }


              </script>
</body>
</html>
